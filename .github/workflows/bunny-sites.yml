name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deploys serialize across every ref; cancelling mid-upload would leave a half-written deploy directory behind.
concurrency:
  group: bunny-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # records the deploy in the repo's Environments
    steps:
      - uses: actions/checkout@v7

      # No build step: static files deploy as-is.

      - uses: BunnyWay/actions/deploy-site@deploy-site_0.1.2
        with:
          site: "bunny-mermaid"
          directory: "./public"
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          cli_version: "0.22"

      # Keep the 3 newest deploys; the live and rollback deploys are never pruned.
      - name: Prune old deploys
        run: npx -y @bunny.net/cli@0.22 sites deployments prune bunny-mermaid --keep 3 --force
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
